[project]
name = "login-app"
version = "0.1.0"
description = "User-facing login web app that consults the Abuse Detection API"
readme = "README.md"
authors = [
    { name = "Clinton Bowen", email = "clinton.bowen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
login-app = "login_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
